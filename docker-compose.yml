services:
  db:
    image: postgres:16-alpine
    container_name: balanceselfcare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-balanceselfcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-balanceselfcare}
    volumes:
      - balanceselfcare-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-balanceselfcare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/haywhyoh/balanceselfcare:latest
    container_name: balanceselfcare
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3003:3000"
    pull_policy: missing
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-balanceselfcare}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-balanceselfcare}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
    volumes:
      - balanceselfcare-media:/app/media

volumes:
  balanceselfcare-db-data:
  balanceselfcare-media:
